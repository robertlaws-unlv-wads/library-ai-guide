# Content validation gate.
#
# This runs on pull requests ONLY. It is deliberately NOT part of the deploy
# path: GitHub Pages serves this site straight from the `main` branch, so a
# failure here is information, never an outage.
#
# It uses no actions beyond checkout and no npm packages at all. The scripts
# it runs are Node standard library only. That is the point -- this repository
# has no package.json, so there is no dependency tree to rot, no lockfile to
# conflict, and nothing for a supply-chain compromise to reach.
#
# Node is preinstalled on the GitHub runner image, so we do not even need
# actions/setup-node.

name: Validate content

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Node version
        run: node --version

      - name: Validate quiz and exercise content
        run: node tools/validate-content.mjs

      - name: Check internal links and section order
        run: node tools/check-links.mjs

      - name: Check header and footer have not drifted
        run: node tools/check-chrome.mjs

      - name: Confirm no dependencies were introduced
        run: |
          if [ -f package.json ]; then
            echo "::error::A package.json has been added. This project is intentionally"
            echo "::error::dependency-free -- see docs/MAINTENANCE.md before changing that."
            exit 1
          fi
          echo "No package.json. Good."

      - name: Confirm no third-party requests were introduced
        run: |
          # about.html promises every file the page loads comes from this site,
          # and that claim has to survive someone opening the Network tab.
          #
          # Check resource-loading contexts only. An <a href> to an external
          # site is normal and fine; a <link>, <script src> or <img src> to
          # one is a third-party request.
          #
          # Note this deliberately does NOT filter on file extension. An
          # earlier version did, and it would have missed
          # href="https://fonts.googleapis.com/css2?family=..." -- which has
          # no .css on the end and is exactly the thing most likely to be
          # pasted in by accident.
          found=0

          if grep -rnE '<link[^>]+href="https?://' --include='*.html' . ; then
            echo "::error::A <link> to an external domain was added (stylesheet, preload or icon)."
            found=1
          fi

          if grep -rnE '<(script|img|iframe|source|video|audio|embed|object)[^>]+(src|data)="https?://' --include='*.html' . ; then
            echo "::error::An external script, image or embed was added."
            found=1
          fi

          if grep -rnE '@import|url\(["'"'"']?https?://' --include='*.css' . ; then
            echo "::error::A CSS @import or remote url() was added."
            found=1
          fi

          if [ "$found" = "1" ]; then
            echo "::error::Self-host the asset instead. See docs/EDITING.md."
            exit 1
          fi
          echo "No third-party requests. Good."

      - name: Confirm bundled fonts still ship their licence
        run: |
          # Roboto Slab and Roboto are Apache 2.0, which requires the licence
          # travel with the redistributed files.
          if ls assets/fonts/*.woff2 >/dev/null 2>&1 && [ ! -f assets/fonts/Roboto-Apache-License.txt ]; then
            echo "::error::Font files are present but assets/fonts/Roboto-Apache-License.txt is missing."
            echo "::error::Apache 2.0 requires the licence ship alongside the fonts."
            exit 1
          fi
          echo "Font licence present. Good."
